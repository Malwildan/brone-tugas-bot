[project]
name = "brone-tugas-bot"
version = "0.1.0"
description = "Find pending BRONE assignments and send them to Telegram."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dateparser>=1.2.0",
  "httpx2[brotli,http2,zstd]>=2.3.0",
  "playwright>=1.52.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
brone-tugas = "brone_tugas_bot.cli:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D",
  "D100",
  "D104",
  "D203",
  "D213",
  "FBT001",
  "FBT002",
  "S105",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]
"src/brone_tugas_bot/cli.py" = ["PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
